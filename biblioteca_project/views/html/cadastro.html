<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre-se - Biblioteca Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>📝 Criar Nova Conta</h2>
        <p>Cadastre-se para gerenciar livros e realizar empréstimos</p>
      </div>

      <% if (typeof erro !== 'undefined' && erro) { %>
        <div class="alert-error"><%= erro %></div>
      <% } %>

      <% if (typeof sucesso !== 'undefined' && sucesso) { %>
        <div class="alert-success"><%= sucesso %></div>
      <% } %>

      <form action="/cadastrar-usuario" method="POST" class="login-form">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Clara Silva" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha"
                 placeholder="Crie uma senha segura (mín. 6 dígitos)"
                 minlength="6" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Senha</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha"
                 placeholder="Repita a senha digitada"
                 minlength="6" required autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-blue btn-block">Criar Conta</button>
      </form>

      <div class="login-footer">
        <p>Já tem uma conta cadastrada? <a href="/login">Fazer Login</a></p>
        <p><a href="/livros" class="link-secondary">← Voltar para o acervo</a></p>
      </div>
    </div>
  </div>

</body>
</html>
