<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Livro - Biblioteca Online</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="logo">
        <span class="icon">📘</span> BIBLIOTECA ONLINE DAS LYCLARI
      </div>
      <div class="header-right">
        <a href="/livros" class="btn-login-nav">← Voltar ao Acervo</a>
      </div>
    </header>

    <div class="edit-container">
      <h1>✏️ Editar Livro</h1>

      <form action="/livros/<%= livro.id %>?_method=PUT" method="POST" class="edit-form">
        <input type="hidden" name="id" value="<%= livro.id %>" />

        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" value="<%= livro.titulo %>" required />

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" value="<%= livro.autor %>" required />

        <label for="ano">Ano:</label>
        <input type="number" id="ano" name="ano" value="<%= livro.ano %>" required />

        <label for="categoria">Categoria:</label>
        <input type="text" id="categoria" name="categoria" value="<%= livro.categoria %>" required />

        <label for="imagemUrl">URL da Imagem:</label>
        <input type="text" id="imagemUrl" name="imagemUrl" value="<%= livro.imagemUrl || '' %>" />

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao"><%= livro.descricao || '' %></textarea>

        <div class="edit-actions">
          <button type="submit" class="btn-blue">💾 Salvar Alterações</button>
          <a href="/livros" class="btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>

    <footer class="footer">
      <p>&copy; 2026 Biblioteca Online LyClari. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
