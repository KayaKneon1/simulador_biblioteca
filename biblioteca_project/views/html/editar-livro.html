<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Livro</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <h1>Editar Livro</h1>

    <form action="/livros?_method=PUT" method="POST">
      <input type="hidden" name="id" value="<%= livro.id %>" />

      <label>Título:</label>
      <input type="text" name="titulo" value="<%= livro.titulo %>" required />

      <br /><br />

      <label>Autor:</label>
      <input type="text" name="autor" value="<%= livro.autor %>" required />

      <br /><br />

      <label>Ano:</label>
      <input type="number" name="ano" value="<%= livro.ano %>" required />

      <br /><br />

      <label>Categoria:</label>
      <input
        type="text"
        name="categoria"
        value="<%= livro.categoria %>"
        required
      />

      <br /><br />

      <label>Imagem:</label>
      <input
        type="text"
        name="imagemUrl"
        value="<%= livro.imagemUrl || '' %>"
      />

      <br /><br />

      <label>Descrição:</label>
      <textarea name="descricao"><%= livro.descricao || '' %></textarea>

      <br /><br />

      <button type="submit">Salvar alterações</button>

      <a href="/livros">Cancelar</a>
    </form>
  </body>
</html>
