<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca Online</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>📚 Biblioteca Online</h2>
        <p>Acesse sua conta para gerenciar livros e empréstimos</p>
      </div>

      <% if (typeof erro !== 'undefined' && erro) { %>
        <div class="alert-error"><%= erro %></div>
      <% } %>

      <% if (typeof sucesso !== 'undefined' && sucesso) { %>
        <div class="alert-success"><%= sucesso %></div>
      <% } %>

      <form action="/login" method="POST" class="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-blue btn-block">Entrar</button>
      </form>

      <div class="login-footer">
        <p>Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
        <p><a href="/livros" class="link-secondary">← Voltar para o acervo</a></p>
      </div>
    </div>
  </div>

</body>
</html>
